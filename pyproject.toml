[project]
name = "todo-mcp-server"
version = "0.1.0"
description = "A minimalist Personal To-Do List MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_mcp"]
